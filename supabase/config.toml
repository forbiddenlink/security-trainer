project_id = "security-trainer"

[auth]
site_url = "https://security-trainer.vercel.app"
additional_redirect_urls = ["https://security-trainer.vercel.app/reset-password", "https://security-trainer.vercel.app/profile"]

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your Security Trainer account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Security Trainer password"
content_path = "./supabase/templates/recovery.html"
