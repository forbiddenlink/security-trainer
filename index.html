<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <!-- Set the theme class before first paint to avoid a flash of the wrong theme.
         Mirrors the persisted zustand key 'security-trainer-theme'. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("security-trainer-theme");
          var theme = raw ? (JSON.parse(raw).state || {}).theme : "system";
          var dark =
            theme === "dark" ||
            ((!theme || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var cl = document.documentElement.classList;
          cl.add(dark ? "dark" : "light");
          cl.remove(dark ? "light" : "dark");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecTrainer | Cyber Security Training</title>
    <meta name="description" content="Level up your security skills with interactive modules on OWASP Top 10, XSS, SQLi, and more. A gamified cyber security training platform." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://security-trainer.vercel.app/" />
    <meta property="og:title" content="SecTrainer | Cyber Security Training" />
    <meta property="og:description" content="Level up your security skills with interactive modules on OWASP Top 10, XSS, SQLi, and more." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://security-trainer.vercel.app/" />
    <meta property="twitter:title" content="SecTrainer | Cyber Security Training" />
    <meta property="twitter:description" content="Level up your security skills with interactive modules on OWASP Top 10, XSS, SQLi, and more." />
    <meta property="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
