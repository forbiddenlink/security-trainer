<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · SecTrainer</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0b0d10;
        color: #e6e9ef;
        text-align: center;
        padding: 1.5rem;
      }
      .card { max-width: 28rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #9aa4b2; line-height: 1.5; margin: 0 0 1.5rem; }
      button {
        font: inherit;
        font-weight: 600;
        padding: 0.65rem 1.25rem;
        border-radius: 0.5rem;
        border: 0;
        background: #3b82f6;
        color: #fff;
        cursor: pointer;
      }
      @media (prefers-color-scheme: light) {
        body { background: #f7f8fa; color: #111827; }
        p { color: #4b5563; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        SecTrainer can't reach the network right now. Pages you've already
        visited may still work. Reconnect and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
