<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <title>Offline | SecTrainer</title>
    <style>
      :root {
        --bg: #f3f2ec;
        --card: #fbfbf7;
        --border: #cfcdc2;
        --fg: #12130f;
        --muted: #55554c;
        --signal: #d7f75b;
        --signal-ink: #12130f;
        --btn-bg: #3b4a07;
        --btn-fg: #f6f8e4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0d0b;
          --card: #121410;
          --border: #2c2f27;
          --fg: #ecebe4;
          --muted: #a3a397;
          --signal: #d7f75b;
          --signal-ink: #12130f;
          --btn-bg: #d7f75b;
          --btn-fg: #12130f;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 1.5rem;
      }
      .panel {
        max-width: 28rem;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2.25rem 2rem;
        position: relative;
        text-align: left;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1.25rem;
      }
      .brand-title {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .brand-sub {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin: 0 0 0.5rem 0;
        text-transform: uppercase;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem 0;
      }
      p {
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.55;
        margin: 0 0 1.75rem 0;
      }
      button {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.75rem 1.5rem;
        border-radius: 3px;
        border: 0;
        background: var(--btn-bg);
        color: var(--btn-fg);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: opacity 0.15s ease;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none" aria-hidden="true">
          <rect x="1.5" y="1.5" width="29" height="29" rx="3" stroke="currentColor" stroke-width="1.75"/>
          <circle cx="16" cy="16" r="9" stroke="currentColor" stroke-width="1.5"/>
          <path d="M16 1.5v5.5M16 25v5.5M1.5 16h5.5M25 16h5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M16 7a9 9 0 0 1 9 9h-9z" fill="#d7f75b"/>
          <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
        </svg>
        <div>
          <div class="brand-title">SecTrainer</div>
          <div class="brand-sub">Signal Range</div>
        </div>
      </div>
      <p class="tag">[ STATUS: OFFLINE // LOCAL CACHE ACTIVE ]</p>
      <h1>Connection Lost</h1>
      <p>
        SecTrainer cannot reach the network right now. Cached modules and your
        local progress remain intact in browser storage. Reconnect and retry.
      </p>
      <button onclick="location.reload()">
        <span>Retry Connection</span>
        <span aria-hidden="true">&rarr;</span>
      </button>
    </div>
  </body>
</html>
